<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obsidian Slim Bar</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="mode-slim">
  <!-- ==================== INLINE SVG ICON SPRITE (Lucide-style, offline, currentColor) ==================== -->
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.01"/><path d="M10 8h.01"/><path d="M14 8h.01"/><path d="M18 8h.01"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/><path d="M7 16h10"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
      <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></symbol>
      <symbol id="i-task" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
      <symbol id="i-divider" viewBox="0 0 24 24"><path d="M3 12h18"/><path d="m8 8 4-4 4 4"/><path d="m16 16-4 4-4-4"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
    </defs>
  </svg>

  <div id="app-shell" class="app-shell">
    <!-- ==================== SLIM BAR HEADER (ALWAYS VISIBLE) ==================== -->
    <!-- Buttons collapse by priority as the bar narrows (see container queries in styles.css) -->
    <header id="slim-bar" class="slim-bar">
      <!-- Drag Grip -->
      <div class="drag-handle" title="Drag to move">
        <svg class="icon"><use href="#i-grip"/></svg>
      </div>

      <!-- Active .md Note (Click to open Setup) -->
      <button id="btn-note-badge" class="note-pill no-drag" title="Change note or hotkey">
        <span id="vault-status-dot" class="status-dot disconnected"></span>
        <span id="active-note-name" class="note-name">Select a note</span>
      </button>

      <!-- 1-Line Instant Capture Input -->
      <div class="quick-capture-wrap no-drag">
        <input
          id="quick-capture-input"
          type="text"
          class="quick-capture-input"
          placeholder="Quick note…"
          autocomplete="off"
          spellcheck="true"
        />
      </div>

      <!-- Right Action Buttons -->
      <div class="bar-actions no-drag">
        <button id="btn-pin" class="icon-btn prio-4 active" title="Pin on top (Alt+Shift+P)">
          <svg class="icon"><use href="#i-pin"/></svg>
        </button>

        <button id="btn-expand" class="icon-btn expand-btn" title="Expand / collapse">
          <svg class="icon"><use href="#i-chevron"/></svg>
        </button>

        <button id="btn-open-obsidian" class="icon-btn prio-6" title="Open in Obsidian">
          <svg class="icon"><use href="#i-external"/></svg>
        </button>

        <button id="btn-settings" class="icon-btn prio-5" title="Settings">
          <svg class="icon"><use href="#i-settings"/></svg>
        </button>

        <button id="btn-overflow" class="icon-btn overflow-btn" title="More">
          <svg class="icon"><use href="#i-more"/></svg>
        </button>

        <button id="btn-hide" class="icon-btn close-btn" title="Hide to tray">
          <svg class="icon"><use href="#i-minus"/></svg>
        </button>
      </div>
    </header>

    <!-- ==================== EXPANDED WORKSPACE ==================== -->
    <main id="expanded-workspace" class="expanded-workspace">
      <!-- SETUP PANEL (Shown automatically on first launch, or via Settings) -->
      <section id="setup-panel" class="overlay-panel hidden">
        <div class="panel-header">
          <div>
            <h3>Setup</h3>
            <p class="panel-subtitle">Pick a note and a hotkey.</p>
          </div>
          <button id="btn-close-setup" class="icon-btn" title="Close">
            <svg class="icon"><use href="#i-x"/></svg>
          </button>
        </div>

        <!-- CARD 1: .MD FILE SELECTION -->
        <div class="setup-card">
          <div class="card-title-row">
            <span class="step-badge">1</span>
            <label class="card-title" for="input-note-path">Note</label>
          </div>
          <p class="card-help">The .md file this bar reads and writes.</p>
          <div class="file-picker-row">
            <input
              id="input-note-path"
              type="text"
              class="path-input"
              placeholder="C:\…\Vault\Scratchpad.md"
              spellcheck="false"
            />
            <button id="btn-browse-note" class="secondary-btn">
              <svg class="icon"><use href="#i-folder"/></svg>
              <span>Browse</span>
            </button>
          </div>
          <div id="path-error-msg" class="error-msg hidden"></div>
        </div>

        <!-- CARD 2: UNIVERSAL HOTKEY RECORDER -->
        <div class="setup-card">
          <div class="card-title-row">
            <span class="step-badge">2</span>
            <label class="card-title">Hotkey</label>
          </div>
          <p class="card-help">Click the box, then press your shortcut.</p>
          <div class="hotkey-recorder-row">
            <button id="btn-record-hotkey" class="hotkey-recorder-box" type="button">
              <span id="hotkey-badges" class="hotkey-badges">
                <kbd>Alt</kbd> + <kbd>Space</kbd>
              </span>
              <span class="recorder-hint-wrap">
                <svg class="icon icon-sm"><use href="#i-keyboard"/></svg>
                <span id="recorder-hint" class="recorder-hint">Click to change</span>
              </span>
            </button>
            <button id="btn-reset-hotkey" class="secondary-btn" type="button" title="Reset to Alt+Space">
              <svg class="icon"><use href="#i-reset"/></svg>
              <span>Reset</span>
            </button>
          </div>
        </div>

        <!-- CARD 3: THEME (applies instantly; Auto follows Windows light/dark mode) -->
        <div class="setup-card">
          <div class="card-title-row theme-row">
            <span class="card-title">Theme</span>
            <div id="theme-switch" class="md-mode-switch theme-switch" role="radiogroup" aria-label="Theme">
              <button class="mode-switch-btn" data-theme="dark" type="button" role="radio" title="Dark">
                <svg class="icon icon-sm"><use href="#i-moon"/></svg>
                <span>Dark</span>
              </button>
              <button class="mode-switch-btn" data-theme="light" type="button" role="radio" title="Light">
                <svg class="icon icon-sm"><use href="#i-sun"/></svg>
                <span>Light</span>
              </button>
              <button class="mode-switch-btn" data-theme="system" type="button" role="radio" title="Follow Windows light/dark mode">
                <svg class="icon icon-sm"><use href="#i-monitor"/></svg>
                <span>Auto</span>
              </button>
            </div>
          </div>
        </div>

        <!-- CARD 4: START WITH WINDOWS -->
        <div class="setup-card startup-row">
          <label class="checkbox-label">
            <input id="checkbox-open-at-login" type="checkbox" checked />
            <div class="checkbox-text">
              <strong>Start with Windows</strong>
              <span>Keeps the hotkey ready after boot.</span>
            </div>
          </label>
        </div>

        <!-- FOOTER ACTIONS -->
        <div class="setup-footer">
          <button id="btn-save-setup" class="primary-btn">
            <svg class="icon"><use href="#i-check"/></svg>
            <span>Save</span>
          </button>
          <button id="btn-quit-app" class="danger-btn" title="Quit the app completely">
            <svg class="icon"><use href="#i-power"/></svg>
            <span>Quit</span>
          </button>
        </div>
      </section>

      <!-- Markdown Toolbar + Mode Switcher (Normal vs Origin) -->
      <div class="md-toolbar">
        <div class="md-tools-left">
          <button class="md-btn md-text" data-md="h1" title="Heading 1">H1</button>
          <button class="md-btn md-text" data-md="h2" title="Heading 2">H2</button>
          <button class="md-btn md-text" data-md="bold" title="Bold"><b>B</b></button>
          <button class="md-btn md-text" data-md="italic" title="Italic"><i>I</i></button>
          <span class="md-sep"></span>
          <button class="md-btn" data-md="task" title="Task (- [ ] )">
            <svg class="icon"><use href="#i-task"/></svg>
          </button>
          <button class="md-btn" data-md="bullet" title="Bullet list (- )">
            <svg class="icon"><use href="#i-list"/></svg>
          </button>
          <button class="md-btn md-secondary" data-md="time" title="Timestamp">
            <svg class="icon"><use href="#i-clock"/></svg>
          </button>
          <button class="md-btn md-secondary" data-md="divider" title="Divider (---)">
            <svg class="icon"><use href="#i-divider"/></svg>
          </button>

          <!-- Shown only on narrow widths: holds the secondary tools -->
          <div class="md-more">
            <button id="btn-md-more" class="md-btn" title="More tools">
              <svg class="icon"><use href="#i-more"/></svg>
            </button>
            <div id="md-more-menu" class="md-more-menu hidden">
              <button class="md-btn md-menu-item" data-md="time">
                <svg class="icon"><use href="#i-clock"/></svg><span>Timestamp</span>
              </button>
              <button class="md-btn md-menu-item" data-md="divider">
                <svg class="icon"><use href="#i-divider"/></svg><span>Divider</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Mode Switcher: Normal (Live Preview) vs Origin (Raw Markdown) -->
        <div class="md-mode-switch">
          <button id="btn-mode-normal" class="mode-switch-btn active" title="Normal: live preview">
            <svg class="icon icon-sm"><use href="#i-eye"/></svg>
            <span class="mode-label">Normal</span>
          </button>
          <button id="btn-mode-origin" class="mode-switch-btn" title="Origin: raw Markdown">
            <svg class="icon icon-sm"><use href="#i-code"/></svg>
            <span class="mode-label">Origin</span>
          </button>
        </div>
      </div>

      <!-- Editor Workspace: one CodeMirror editor for Normal (live preview) & Origin (raw) modes -->
      <div class="editor-container">
        <div id="editor" class="editor-host"></div>
      </div>

      <!-- Status & Opacity Footer -->
      <footer class="status-footer">
        <div class="sync-status">
          <span id="save-indicator" class="save-indicator">Synced</span>
          <span id="word-counter" class="word-counter">0 words</span>
        </div>

        <div class="opacity-control" title="Window transparency">
          <span class="opacity-label">Opacity</span>
          <input
            id="opacity-slider"
            type="range"
            min="0.2"
            max="1"
            step="0.01"
            value="1"
          />
        </div>
      </footer>
    </main>
  </div>

  <script src="./vendor/codemirror.js"></script>
  <script src="./markdown-helper.js"></script>
  <script src="./app.js"></script>
</body>
</html>
